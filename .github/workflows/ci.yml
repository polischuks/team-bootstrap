name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate roles, links, and manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static role validation (all 42 roles)
        run: bin/eval-role.sh --all

      - name: Validate JSON (plugin manifest, schemas, skills manifest)
        run: |
          python3 - <<'PY'
          import json, glob, sys
          files = (
              glob.glob('.claude-plugin/*.json')
              + glob.glob('references/schemas/*.json')
              + ['skills-manifest.json']
          )
          bad = []
          for f in files:
              try:
                  json.load(open(f, encoding='utf-8'))
                  print(f"  ok  {f}")
              except Exception as e:
                  bad.append(f"{f}: {e}")
          if bad:
              print("INVALID JSON:\n" + "\n".join(bad)); sys.exit(1)
          PY

      - name: Internal markdown link integrity
        run: |
          python3 - <<'PY'
          import re, os, glob, sys
          broken = []
          for md in glob.glob('**/*.md', recursive=True):
              base = os.path.dirname(md)
              text = open(md, encoding='utf-8').read()
              for m in re.finditer(r'\]\(([^)]+\.md)(#[^)]*)?\)', text):
                  link = m.group(1)
                  if link.startswith('http'):
                      continue
                  tgt = os.path.normpath(os.path.join(base, link))
                  if not os.path.exists(tgt):
                      broken.append(f"{md} -> {link}")
          if broken:
              print("BROKEN LINKS:\n" + "\n".join(broken)); sys.exit(1)
          print(f"  ok  no broken internal links ({len(glob.glob('**/*.md', recursive=True))} files)")
          PY

  suite:
    name: "Test suite (AGENTS.md Test: bin/run-tests.sh)"
    # macOS, not ubuntu: bin/run-tests.sh is the DECLARED Test: suite, developed and known-green on
    # macOS/bash 3.2 (the maintainer platform). Running it here makes a genuinely-red suite fail CI —
    # #53's guarantee — on the platform the suite targets. It is NOT yet green on Linux (four members
    # fail on ubuntu, pre-existing, exposed by this very job): issue #59 tracks making this an
    # os:[macos,ubuntu] matrix once those are fixed. Runners: GitHub macos images also ship bash 3.2.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # The runner decides red/green for every gate, so prove the runner itself FIRST: if it is
      # broken, the suite result below is meaningless. These two proofs are excluded from the sweep
      # (to avoid re-entry) and were invoked by nothing until now (issue #54).
      - name: Test runner's own proofs
        run: |
          bash bin/run-tests.sh --self-test
          bash tests/run-tests.test.sh

      # The declared Test: suite — 36 tests/*.test.sh + 29 bin/*.sh --self-test. A red member exits
      # non-zero and fails this required check; the runner prints `run-tests: FAIL test — <name>` to
      # stderr, so the failing member is named in the log (issue #53). --jobs is left to the runner's
      # auto-detect (CPU count capped at 8); GitHub runners have 2-4 cores.
      - name: Suite
        run: bin/run-tests.sh
