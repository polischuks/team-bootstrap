name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate roles, links, and manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static role validation (all 42 roles)
        run: bin/eval-role.sh --all

      - name: Validate JSON (plugin manifest, schemas, skills manifest)
        run: |
          python3 - <<'PY'
          import json, glob, sys
          files = (
              glob.glob('.claude-plugin/*.json')
              + glob.glob('references/schemas/*.json')
              + ['skills-manifest.json']
          )
          bad = []
          for f in files:
              try:
                  json.load(open(f, encoding='utf-8'))
                  print(f"  ok  {f}")
              except Exception as e:
                  bad.append(f"{f}: {e}")
          if bad:
              print("INVALID JSON:\n" + "\n".join(bad)); sys.exit(1)
          PY

      - name: Internal markdown link integrity
        run: |
          python3 - <<'PY'
          import re, os, glob, sys
          broken = []
          for md in glob.glob('**/*.md', recursive=True):
              base = os.path.dirname(md)
              text = open(md, encoding='utf-8').read()
              for m in re.finditer(r'\]\(([^)]+\.md)(#[^)]*)?\)', text):
                  link = m.group(1)
                  if link.startswith('http'):
                      continue
                  tgt = os.path.normpath(os.path.join(base, link))
                  if not os.path.exists(tgt):
                      broken.append(f"{md} -> {link}")
          if broken:
              print("BROKEN LINKS:\n" + "\n".join(broken)); sys.exit(1)
          print(f"  ok  no broken internal links ({len(glob.glob('**/*.md', recursive=True))} files)")
          PY

  # The declared `Test:` suite (AGENTS.md) — nothing ran it in CI before, so a branch that reddened
  # any behavioural assertion merged green (#53). This job runs it. It runs FIRST the runner's own two
  # proofs, which the sweep deliberately excludes to avoid re-entry and which nothing else invoked (#54),
  # THEN the full suite.
  #
  # MATRIX: macos-latest is REQUIRED (the platform the suite targets and is known green on — a genuinely
  # red suite still fails CI). ubuntu-latest is INFORMATIONAL (continue-on-error) until the cross-platform
  # gap (#59) is closed: its per-member FAIL lines are visible in the log for a data-driven follow-up,
  # without blocking merges on a pre-existing, unrelated portability effort.
  suite:
    name: Declared Test suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # ubuntu is non-blocking; macOS is required (the default — no continue-on-error there).
    continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. Members resolve the repo root commit / walk history
          # (git rev-list --max-parents=0 HEAD, HEAD~N); checkout@v4 defaults to a depth-1 shallow
          # clone that grafts the boundary and hides real history. Matches control-surface-guard.yml.
          fetch-depth: 0

      - name: "Test runner's own two proofs (excluded from the sweep, invoked by nothing else — #54)"
        run: |
          bash bin/run-tests.sh --self-test
          bash tests/run-tests.test.sh

      - name: "Full declared Test suite (bin/run-tests.sh — #53)"
        run: bin/run-tests.sh

